[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "youtube-knowledge-manager"
version = "0.1.0"
description = "Local-first YouTube Liked Videos knowledge manager"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.14,<2",
  "playwright>=1.49,<2",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "streamlit>=1.41,<2",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
ai = ["openai>=1.59,<2"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
ykm = "youtube_knowledge_manager.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_knowledge_manager"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["youtube_knowledge_manager"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "browser: mocked browser adapter tests",
  "integration: database and migration integration tests",
  "live_youtube: opt-in tests that use a real YouTube account",
]
