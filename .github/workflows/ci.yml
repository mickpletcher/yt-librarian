name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not live_youtube" --cov=src/youtube_knowledge_manager --cov-report=term --cov-fail-under=75
      - run: uvx bandit -q -r src
      - run: uv export --frozen --all-extras --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - run: uvx --from pip-audit pip-audit -r requirements-audit.txt
      - run: uv run alembic upgrade head
        env:
          YKM_DATABASE_URL: sqlite:///ci.sqlite3
      - run: uv run alembic check
        env:
          YKM_DATABASE_URL: sqlite:///ci.sqlite3
      - run: uv run alembic downgrade base
        env:
          YKM_DATABASE_URL: sqlite:///ci.sqlite3
